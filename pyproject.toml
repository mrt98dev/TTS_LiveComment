[project]
name = "cmtspeak"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "TuanNDA", email = "63991938+tuannda98@users.noreply.github.com" }
]
requires-python = ">=3.12"
dependencies = [
    "google-api-python-client>=2.200.0",
    "pyside6>=6.11.2",
    "sounddevice>=0.5.6",
    "tiktoklive>=7.0.0",
    "vieneu>=3.6.4",
]

[project.scripts]
cmtspeak = "cmtspeak:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pyinstaller>=6.22.2",
    "pytest>=9.1.1",
]
